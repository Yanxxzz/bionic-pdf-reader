[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bionic-pdf-reader"
version = "0.6.3"
description = "Local multilingual bionic PDF reading, with optional-content layers and original glyph preservation"
readme = "README.en.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Yanxxzz"}]
keywords = ["bionic-reading", "pdf", "reading", "multilingual", "english-reading"]
dependencies = ["pypdf==6.21.4", "fonttools==4.63.0", "regex>=2024.11.6", "freetype-py==2.5.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4.4,<6", "pypdfium2>=5.9,<6", "Pillow>=10", "build>=1.2"]
ocr = ["pypdfium2>=5.9,<6", "Pillow>=10"]
windows = ["pyinstaller>=6,<8", "pypdfium2>=5.9,<6", "Pillow>=10"]

[project.scripts]
bionic-pdf = "bionic_pdf.cli:main"

[project.gui-scripts]
bionic-pdf-gui = "bionic_pdf.gui:main"

[project.urls]
Homepage = "https://github.com/Yanxxzz/bionic-pdf-reader"
Issues = "https://github.com/Yanxxzz/bionic-pdf-reader/issues"

[tool.setuptools]
packages = ["bionic_pdf", "bionic_pdf.reader"]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"
"bionic_pdf.reader" = "extension"

[tool.setuptools.package-data]
"bionic_pdf.reader" = ["*.html", "*.css", "*.mjs", "*.txt", "assets/*.png", "assets/first-read.pdf", "vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
