<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>$title · Bionic PDF Reader</title>
  <style>
    :root { color-scheme: light; --pine: #183d32; --paper: #f6f3eb; --ink: #262b27; --line: #cccbbd; --focus: #a25d21; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.8 system-ui, "Microsoft YaHei", sans-serif; }
    main { max-width: 58rem; margin: auto; padding: 0 clamp(1rem,4vw,3rem) 3rem; }
    .mast, footer { display: flex; justify-content: space-between; align-items: center; gap: .8rem; }
    .mast { padding: 1rem 0; color: var(--pine); border-bottom: 1px solid var(--line); }
    .brand { font: 1.2rem Georgia, "Songti SC", serif; }
    .mark { display: inline-block; padding: .18rem .28rem; margin-right: .55rem; border: 1px solid currentColor; }
    .mast small, footer { font-size: .82rem; }
    .hero { margin: 2rem 0; display: grid; grid-template-columns: 1.15fr 1fr; align-items: stretch; background: var(--pine); color: var(--paper); }
    .hero div { align-self: center; padding: clamp(1.25rem,4vw,2.6rem); }
    .hero img { width: 100%; height: 100%; min-height: 12rem; object-fit: cover; }
    h1 { margin: 0; font: 600 clamp(1.65rem,4vw,2.5rem)/1.3 Georgia, "Songti SC", SimSun, serif; }
    .hero p { margin: .8rem 0 0; }
    details { border-bottom: 1px solid var(--line); }
    summary { padding: 1rem .2rem; font-weight: 650; color: var(--pine); cursor: pointer; }
    details p, details ol { max-width: 43rem; margin: 0 1rem 1rem; overflow-wrap: anywhere; }
    ol { padding-left: 1.3rem; }
    li + li { margin-top: .35rem; }
    a { color: var(--pine); text-underline-offset: .2em; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    footer { margin-top: 2rem; }
    @media (max-width: 37rem) {
      .hero { grid-template-columns: 1fr; margin: 1.25rem 0; }
      .hero img { height: 9rem; min-height: 0; }
    }
    @media print { .hero { background: white; color: var(--ink); } .hero img { display: none; } }
  </style>
</head>
<body>
  <main>
    <header class="mast"><span class="brand" lang="en"><span class="mark" aria-hidden="true"><b>B</b><i>r</i></span>Bionic PDF Reader</span><small>v$version</small></header>
    <section class="hero" aria-labelledby="guide-title">
      <div><h1 id="guide-title">$title</h1><p>$intro</p></div>
      <img src="data:image/png;base64,$cover" alt="">
    </section>
    $sections
    <footer><a href="https://github.com/Yanxxzz/bionic-pdf-reader/releases">下载与版本记录</a></footer>
  </main>
</body>
</html>
