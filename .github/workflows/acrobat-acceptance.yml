name: Installed Acrobat acceptance
on:
  push:
    branches: [qa/native-picker-041]
    paths: ['tests/native_acrobat_fixture.py', '.github/workflows/acrobat-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  acrobat:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: shaped-pdfs
          path: .tmp/examples/
          github-token: ${{ github.token }}
          run-id: 42347000083
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the signed Adobe Reader distribution on the test machine
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'Reader64.exe'
          curl.exe --fail --location --retry 2 -o $setup 'https://ardownload2.adobe.com/pub/adobe/acrobat/win/AcrobatDC/2600322075/AcroRdrDCx642600322075_MUI.exe'
          if ($LASTEXITCODE -or (Get-FileHash -LiteralPath $setup).Hash -ne '7BEC66953457F6BC78BCE9F0A1DCDDE1C4CF2A8F8AC26F73FCECF5738F42F307') { throw 'Unexpected installer digest' }
          $sig = Get-AuthenticodeSignature -LiteralPath $setup
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Adobe') { throw 'Invalid Adobe signature' }
          $proc = Start-Process -FilePath $setup -ArgumentList '-sfx_nu /sAll /rs /msi EULA_ACCEPT=YES' -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -notin 0,3010) { throw "Adobe setup failed with $($proc.ExitCode)" }
          # Suppress first-launch tips and subscription offers only on this disposable VM.
          foreach ($product in @('Acrobat Reader', 'Adobe Acrobat')) {
            $pref = "HKLM:\SOFTWARE\Policies\Adobe\$product\DC\FeatureLockDown"
            New-Item -Path $pref -Force | Out-Null
            New-ItemProperty -Path $pref -Name bToggleFTE -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $pref -Name bAcroSuppressUpsell -PropertyType DWord -Value 1 -Force | Out-Null
            $onboarding = "HKCU:\Software\Adobe\$product\DC\FTEDialog"
            New-Item -Path $onboarding -Force | Out-Null
            New-ItemProperty -Path $onboarding -Name bShownViewerOnboarding -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $onboarding -Name bShownHomeOnboarding -PropertyType DWord -Value 1 -Force | Out-Null
          }
      - run: python -m pip install pywinauto pywin32 Pillow rapidocr-onnxruntime
      - name: Inspect pages and copy through the installed reader
        shell: pwsh
        run: |
          foreach ($attempt in @('first', 'reopen')) {
            $env:ACROBAT_ATTEMPT = $attempt
            python -X utf8 tests/native_acrobat_fixture.py
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 'first') {
              # Reopen with the same test profile if a first-run window interferes.
              Get-Process -Name Acrobat -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 | ForEach-Object { [void]$_.CloseMainWindow() }
              Start-Sleep -Seconds 5
            }
          }
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-acrobat-results
          path: test-results/
          retention-days: 7
