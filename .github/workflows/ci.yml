name: Native Safari acceptance
on:
  push:
    branches: [qa/native-picker-041]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  safari:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the candidate reader is unchanged
        run: git diff --exit-code 20f4dd56c25ce9a12da5f7d44f395c00b23bf436 HEAD -- extension examples
      - uses: actions/download-artifact@v8
        with:
          name: shaped-pdfs
          path: .tmp/examples/
          github-token: ${{ github.token }}
          run-id: 42347000083
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pyobjc-framework-Quartz pyobjc-framework-ApplicationServices
      - run: python tests/native_safari_fixture.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: safari-native-${{ matrix.os }}
          path: test-results/
