name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: python scripts/make_examples.py
      - run: npm run fixtures:shaped
      - run: python scripts/prepare_shaped_outputs.py
      - run: python -m pytest tests/test_shaped_pdf.py -q
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:extension
      - run: npm run test:shaped
      - uses: actions/upload-artifact@v7
        with:
          name: shaped-pdfs
          path: .tmp/examples/shaped-*.pdf
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
  apple-readers:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install -e ".[dev]" selenium
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run fixtures:shaped
      - run: python scripts/prepare_shaped_outputs.py
      - run: swift scripts/check_pdfkit.swift .tmp/examples/shaped-tagged.pdf .tmp/examples/shaped-switchable.pdf .tmp/examples/shaped-static.pdf
      - run: open -a Preview .tmp/examples/shaped-static.pdf
      - run: pgrep -x Preview
      - run: sudo safaridriver --enable
      - run: python tests/safari.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-reader-results
          path: test-results/
          retention-days: 7
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,windows]"
      - run: python scripts/build_windows.py
      - run: python scripts/smoke_windows.py
      - run: python -m build
      - run: python scripts/build_packages.py
      - run: python scripts/audit_release.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/
          retention-days: 7
